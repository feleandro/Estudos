        O Iframe serve para abrir uma pequena janela de navegador

        Tem Alguns Site  Navegadores que Não Abre por motivo de segurança tipo o Google <iframe src="https://www.google.com" frameborder="0"></iframe>

        Mas Podemos Abrir o Meu Site <iframe src="https://feleandro.github.io/projeto-cordel/" frameborder="0"></iframe>
