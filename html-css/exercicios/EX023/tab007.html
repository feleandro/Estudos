<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas com Mesclagem</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            
        }
        table{
            border-collapse: collapse;
            width: 400px;
            
        }   
        td{
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
        .ex{
            background-color: rgba(187, 76, 76, 0.557);
            border: 2px solid blue;
            color: blue;
        }
    </style>
</head>
<body>
    <h1>Tabela com Mesclagem 002</h1>
    <table>
        <tr>
            <td colspan="4" class="ex">A</td>
            <td rowspan="4" class="ex">B</td>
        </tr>
        <tr>
            <td rowspan="4" class="ex">C</td>
            <td>D</td>
            <td>E</td>
            <td>F</td>
        </tr>
        <tr>
            <td>G</td>
            <td>H</td>
            <TD>I</TD>
        </tr>
        <tr>
            <td>J</td>
            <td>L</td>
            <td>M</td>
        </tr>
        <tr>
            <td colspan="4" class="ex">N</td>
            
        </tr>
    </table>
</body>
</html>
