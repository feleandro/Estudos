<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos De Formulários</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
    <fieldset>
        <legend>Dados Pessoais</legend>
        <p>
            <label for="inome"> Nome</label>
            <input type="text" name="nome" id="inome" maxlength="20" minlength="5" required>
       </p>
        <p>
            <label for="iemail">E-mail</label>
            <input type="email" name="email" id="iemail" required autocomplete="email">
        </p>
        <p>
            <label for="itel">Telefone</label>
            <input type="tel" name="telefone" id="itel" required autocomplete="tel-national" placeholder="(xx)xxxxx-xxxx">
        </p>
    </fieldset>
        
        <!-- estudar sobre expressões regulares (RegEx) todas Regexfica na teg pattern="^ [0-9]{4}-[0-9]{4} $"-->
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
